name: iOS app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    permissions:
      contents: write   # to publish small screenshot copies to the ci-screenshots branch
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          runtimes = sorted([k for k in d if "iOS" in k and d[k]], key=ver)
          phones = []
          for k in reversed(runtimes):
              phones = [x for x in d[k] if x["name"].startswith("iPhone")]
              if phones: break
          pro = [x for x in phones if "Pro" in x["name"]]
          print((pro or phones)[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
          # App Store screenshots: boot it and show a tidy status bar (9:41, full battery and signal)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true

      - name: Build and run tests
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project ReadingTracker.xcodeproj \
            -scheme ReadingTracker \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -iE "error:|warning: .*\.swift|Test case .*(passed|failed)|recorded an issue|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log || { echo "---- last 120 lines ----"; tail -120 build.log; exit 1; }

      - name: Test summary (includes Swift Testing)
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact > summary.json || exit 0
          python3 - <<'PY'
          import json
          s = json.load(open("summary.json"))
          print(f"Passed: {s.get('passedTests')}  Failed: {s.get('failedTests')}  Skipped: {s.get('skippedTests')}  Total: {s.get('totalTestCount')}")
          for f in s.get("testFailures", []):
              print("FAILED:", f.get("testName"), "-", f.get("failureText"))
          if (s.get("totalTestCount") or 0) < 30:
              raise SystemExit("Expected at least 30 tests (unit + UI); some didn't run.")
          PY

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            ${{ runner.temp }}/screenshots
            ios/build.log
          if-no-files-found: ignore

      - name: Upload App Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/screenshots/AppStore
          if-no-files-found: ignore

      - name: Publish small screenshots to the ci-screenshots branch
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          [ -d screenshots ] || exit 0
          rm -rf shots && mkdir shots
          (cd screenshots && find . -name '*.png' -o -name '*.jpg' | while read -r f; do
            out="../shots/$(echo "${f#./}" | tr '/' '_' | sed 's/\.png$/.jpg/')"
            sips -Z 900 -s format jpeg -s formatOptions 60 "$f" --out "$out" >/dev/null
          done)
          tail -150 "$GITHUB_WORKSPACE/ios/build.log" > shots/build-tail.txt || true
          grep -E "error:" "$GITHUB_WORKSPACE/ios/build.log" | head -60 > shots/errors.txt || true
          cd shots
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
